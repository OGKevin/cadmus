# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "chill"
early_access: false
enable_free_tier: true
inheritance: true
reviews:
  review_status: false
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_instructions: |
    Short reviewer brief in these sections, in order.
    Omit a section only if it is empty.

    ## What
    1–3 sentences on the user- or system-visible change.

    ## Why
    Motivation, from the description, linked issues, and commits.

    ## How
    2–5 bullets on the approach, not every touched path.
    Mention migrations, feature flags, settings, or docs only when
    they exist.

    ## Related
    Links to related issues and PRs as [#123](url), including
    mentioned items and closely related open or merged work.
    "None found." if empty; do not invent numbers.

    ## Risk
    `**Risk:** {Low|Medium|High} ({1–5}/5) — {one-sentence why}`
    Use the highest matching band:
    - 1–2 Low: docs, tests, CI, refactors with no behavior change
    - 3 Medium: localized, reversible behavior or settings/UI
    - 4–5 High: SQLite, OTA/install, power/suspend, native/device
      paths, security, or hard-to-rollback data

    Always end with a GitHub Markdown footnote. Append
    `[^coderabbit]` to the last sentence of the last emitted
    section, then after a blank line add:

    [^coderabbit]: Generated by CodeRabbit.

    Do not wrap the definition in a code fence.
  high_level_summary_in_walkthrough: false
  review_details: true
  changed_files_summary: false
  auto_title_instructions: It should follow https://www.conventionalcommits.org/en/v1.0.0/
  collapse_walkthrough: false
  auto_apply_labels: false
  auto_assign_reviewers: true
  path_filters:
    - "!docs/po/messages.pot"
    - "!.sqlx/**"
  auto_review:
    auto_pause_after_reviewed_commits: 5
    labels:
      - ai-review
    base_branches:
      - master
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    title:
      mode: error
      requirements: It should follow https://www.conventionalcommits.org/en/v1.0.0/
    description:
      mode: "off"
    custom_checks:
      - name: Docs freshness
        mode: warning
        instructions: >
          Apply Documentation freshness in REVIEW.md (and nested REVIEW.md
          files). Warn when docs are stale, or when a new user/contributor-facing
          feature lacks matching docs/src coverage (and SUMMARY/POT where
          required), unless the PR justifies skipping.
  tools:
    github-checks:
      timeout_ms: 900000
chat: {}
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "REVIEW.md"
        applyTo: "**/*"
      - files: "crates/core/REVIEW.md"
        applyTo: "crates/core/**,crates/cadmus/**,contrib/Settings-sample.toml"
      - files: "docs/REVIEW.md"
        applyTo: "docs/**,devenv.nix"
code_generation: {}
issue_enrichment:
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - "ai-plan"
