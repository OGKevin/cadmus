[package]
name = "xtask"
version = "0.12.0"
edition = "2024"
description = "Build, test, and release automation for Cadmus"

[lib]
name = "xtask_lib"
path = "src/lib.rs"

[[bin]]
name = "cadmuscli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = { workspace = true }
build-deps = { path = "../crates/build-deps" }
bytesize = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
flate2 = "1"
io_tee = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
russh = { version = "0.65", default-features = false, features = ["rsa", "ring"] }
russh-config = "0.58"
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
walkdir = "2"
wildmatch = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
