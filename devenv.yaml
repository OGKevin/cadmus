inputs:
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Same release as the `slint` crate. `flake: false` keeps Slint's own
  # flake from being pulled in; devenv.nix only reads the skill and the
  # workspace version. Renovate bumps this tag with the crate.
  slint:
    url: github:slint-ui/slint/v1.18.1
    flake: false
