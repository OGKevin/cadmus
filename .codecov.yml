comment: false

ignore:
  - "thirdparty/**"
  - "mupdf_wrapper/**"
  - "**/build.rs"

coverage:
  status:
    project:
      default:
        informational: true
        threshold: 10%
    patch:
      default:
        target: auto
        threshold: 10%
        only_pulls: true
        paths:
          - "**/*.rs"
        if_no_uploads: success
        if_not_found: success
