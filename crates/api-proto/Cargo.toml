[package]
name = "cadmus-api-proto"
version = "0.12.0"
edition = "2024"
description = "Generated ConnectRPC types for the Cadmus public and shared APIs"

[dependencies]
buffa = { workspace = true }
buffa-types = { workspace = true }
connectrpc = { workspace = true, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
buffa = { workspace = true }
build-deps = { path = "../build-deps" }
connectrpc-build = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
