name: Actions lint report

on:
  workflow_run:
    workflows: ["Actions lint"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  post-review:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          sparse-checkout: |
            .github/actions
          path: ci
          persist-credentials: false

      - uses: ./ci/.github/actions/identify-workflow-run-pr
        id: identify-pr

      - uses: ./ci/.github/actions/checkout-workflow-run-pr-head
        if: steps.identify-pr.outputs.number
        with:
          base_ref: ${{ steps.identify-pr.outputs.base_ref }}
          path: pr

      - uses: ./ci/.github/actions/reviewdog-post
        if: steps.identify-pr.outputs.number
        with:
          pr_number: ${{ steps.identify-pr.outputs.number }}
          artifact_name: actionlint-reviewdog-input
          diagnostics_path: actionlint-reviewdog-input/diagnostics.txt
          name: actionlint
          workdir: pr
          errorformat: "%t:%f:%l:%c: %m"

      - uses: ./ci/.github/actions/reviewdog-post
        if: steps.identify-pr.outputs.number
        with:
          pr_number: ${{ steps.identify-pr.outputs.number }}
          artifact_name: prettier-actions-reviewdog-input
          diagnostics_path: prettier-actions-reviewdog-input/diagnostics.diff
          name: prettier
          workdir: pr
          format: diff
          reviewdog_flags: -f.diff.strip=1
