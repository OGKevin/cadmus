name: Clippy report

on:
  workflow_run:
    workflows: ["Cargo"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  post-review:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      # Trusted composites from the base repo — never load actions from the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          sparse-checkout: |
            .github/actions
          path: ci
          persist-credentials: false

      - uses: ./ci/.github/actions/identify-workflow-run-pr
        id: identify-pr

      - uses: ./ci/.github/actions/checkout-workflow-run-pr-head
        if: steps.identify-pr.outputs.number
        with:
          base_ref: ${{ steps.identify-pr.outputs.base_ref }}
          path: pr

      - uses: ./ci/.github/actions/reviewdog-post
        if: steps.identify-pr.outputs.number
        with:
          pr_number: ${{ steps.identify-pr.outputs.number }}
          artifact_name: clippy-reviewdog-input
          diagnostics_path: clippy-reviewdog-input/diagnostics.txt
          name: clippy
          workdir: pr
          format: clippy
