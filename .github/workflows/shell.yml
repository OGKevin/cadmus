name: Shell

env:
  SHFMT_VERSION: "3.13.1"

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            shell:
              - '**/*.sh'
              - '.github/workflows/shell.yml'
              - '.github/workflows/shell-report.yml'

  shellcheck:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest images ship shellcheck; pin via install only if that changes.
      - name: Show shellcheck version
        run: shellcheck --version

      - name: Collect shellcheck diagnostics
        id: collect
        run: |
          set -euo pipefail
          mkdir -p shellcheck-reviewdog-input
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found"
            : > shellcheck-reviewdog-input/diagnostics.txt
            : > shellcheck-reviewdog-input/suggestions.diff
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          shellcheck -f json --external-sources "${files[@]}" \
            | jq -r '.[] | "\(.file):\(.line):\(.column):\(.level):\(.message) [SC\(.code)](https://github.com/koalaman/shellcheck/wiki/SC\(.code))"' \
            > shellcheck-reviewdog-input/diagnostics.txt
          json_exit=${PIPESTATUS[0]}
          shellcheck -f diff --external-sources "${files[@]}" \
            > shellcheck-reviewdog-input/suggestions.diff
          diff_exit=$?
          set -e

          if [ "$json_exit" -ne 0 ] || [ "$diff_exit" -ne 0 ]; then
            if [ -s shellcheck-reviewdog-input/diagnostics.txt ] || \
              [ -s shellcheck-reviewdog-input/suggestions.diff ]; then
              echo "upload=true" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload reviewdog input artifact
        if: ${{ !cancelled() && steps.collect.outputs.upload == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shellcheck-reviewdog-input
          path: shellcheck-reviewdog-input/
          if-no-files-found: error
          retention-days: 1

  shfmt:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install-only: reviewdog/action-shfmt always posts via suggester.
      # SHFMT_VERSION is Renovate-managed (see renovate.json customManagers).
      - uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: mvdan/sh
          tag: v${{ env.SHFMT_VERSION }}
          extension-matching: disable
          rename-to: shfmt
          chmod: "0755"

      - name: Collect shfmt diagnostics
        id: collect
        run: |
          set -euo pipefail
          mkdir -p shfmt-reviewdog-input
          # Match devenv.nix / code-style: 2-space indent with case-indent.
          shfmt -i 2 -ci -w .
          if ! git diff --quiet; then
            git diff > shfmt-reviewdog-input/diagnostics.diff
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "::error::shfmt found formatting issues"
            exit 1
          fi
          : > shfmt-reviewdog-input/diagnostics.diff
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload reviewdog input artifact
        if: ${{ !cancelled() && steps.collect.outputs.upload == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shfmt-reviewdog-input
          path: shfmt-reviewdog-input/
          if-no-files-found: error
          retention-days: 1

  required-shell:
    name: required-shell
    permissions: {}
    needs: [changes, shellcheck, shfmt]
    if: ${{ always() && (cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::One or more required jobs failed or were cancelled"
          exit 1
