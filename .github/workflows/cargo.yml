name: Cargo

env:
  NEXTEST_VERSION: "0.9.143"
  NODE_VERSION: "24"
  SQLX_OFFLINE: true
  PKG_CONFIG_PATH_x86_64_unknown_linux_gnu: ${{ github.workspace }}/target/cadmus-build-deps/x86_64-unknown-linux-gnu/sqlite/lib/pkgconfig
  PKG_CONFIG_PATH_arm_unknown_linux_gnueabihf: ${{ github.workspace }}/target/cadmus-build-deps/arm-unknown-linux-gnueabihf/sqlite/lib/pkgconfig
  PKG_CONFIG_ALLOW_CROSS: 1

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:

concurrency:
  group: "cargo-${{ github.event_name }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cargo: ${{ steps.filter.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            cargo:
              - '**/*.rs'
              - 'crates/core/i18n/**'
              - 'Cargo.*'
              - '**/Cargo.*'
              - '.github/workflows/cargo.yml'
              - '.github/actions/apt/**'
              - '.github/actions/build-kobo/**'
              - '.github/actions/build-docs-epub/**'
              - '.github/actions/cargo-cache/**'
              - '.github/actions/cargo-cache-warmup/**'
              - '.github/actions/cache-fonts/**'
              - '.github/actions/install-doc-tools/**'
              - 'build-scripts/**'
              - '.gitmodules'
              - 'mupdf_wrapper/**'
              - 'thirdparty/**'

  format:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cargo == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
        with:
          components: rustfmt
      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
      - &set-build-metadata
        name: Set build metadata
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
            echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          fi
          echo "GIT_VERSION=$(git describe --tags --dirty --always)" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo xtask fmt

  generate-matrix:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cargo == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      test-matrix: ${{ steps.matrix.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Generate feature matrix
        id: matrix
        run: cargo xtask ci matrix

  build-docs-epub:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cargo == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Build documentation EPUB
        uses: ./.github/actions/build-docs-epub
        with:
          node-version: ${{ env.NODE_VERSION }}

  cache-warmup:
    needs: [changes, build-docs-epub]
    if: github.event_name != 'pull_request' || needs.changes.outputs.cargo == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # PRs restore shared caches from the default/base branch; only push writes.
      - name: Skip cache write on pull requests
        if: github.event_name == 'pull_request'
        run: echo "PRs restore the shared cargo cache from the default/base branch; warmup writes only on push."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false

      - name: Set build metadata
        if: github.event_name != 'pull_request'
        run: echo "GIT_VERSION=$(git describe --tags --dirty --always)" >> "$GITHUB_ENV"

      - name: Warm and save shared caches
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/cargo-cache-warmup
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          nextest-version: ${{ env.NEXTEST_VERSION }}

  clippy:
    if: github.event_name == 'pull_request' && needs.changes.outputs.cargo == 'true'
    needs: [changes, generate-matrix, build-docs-epub, cache-warmup]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix).include }}

    runs-on: ${{ matrix.os }}
    name: clippy (${{ matrix.label }}, ${{ matrix.os }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
        with:
          components: clippy
      - *set-build-metadata
      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Download documentation EPUB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-epub
          path: docs/book/epub

      - name: Save clippy JSON artifact
        if: github.event_name == 'pull_request'
        run: |
          slug="${{ matrix.features }}"
          slug="${slug:-default}"
          cargo xtask clippy --features "${{ matrix.label }}" --save-json "clippy-json/${slug}.json"

      - name: Upload clippy JSON artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clippy-json-${{ matrix.features || 'default' }}
          path: clippy-json/
          retention-days: 1

  clippy-report:
    if: github.event_name == 'pull_request' && needs.changes.outputs.cargo == 'true'
    needs: [changes, clippy]

    permissions:
      contents: read

    runs-on: ubuntu-latest
    name: clippy-report

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
        with:
          components: clippy
      - *set-build-metadata
      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Download all clippy JSON artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: clippy-json-*
          path: clippy-json
          merge-multiple: true

      - name: Coalesce clippy diagnostics for reviewdog
        run: |
          cargo xtask ci clippy-report \
            --artifacts-dir clippy-json \
            --output clippy-reviewdog-input/diagnostics.txt

      - name: Upload reviewdog input artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clippy-reviewdog-input
          path: clippy-reviewdog-input/
          retention-days: 1

  test:
    needs: [changes, generate-matrix, build-docs-epub, cache-warmup]
    if: github.event_name != 'pull_request' || needs.changes.outputs.cargo == 'true'
    permissions:
      contents: read
    env:
      TEST_ROOT_DIR: ${{ github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.test-matrix).include }}

    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.label }}, ${{ matrix.os }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
        with:
          components: llvm-tools
      - *set-build-metadata
      - name: Download documentation EPUB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-epub
          path: docs/book/epub

      - name: Install apt packages (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt
      - name: Cache Homebrew packages (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/cargo.yml') }}
          restore-keys: ${{ runner.os }}-brew-
      - name: Install Homebrew packages (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 freetype harfbuzz openjpeg jpeg-turbo libpng jbig2dec gumbo-parser djvulibre pkg-config

      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}

      - name: Restore bundled fonts
        uses: ./.github/actions/cache-fonts
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Restore cargo-llvm-cov
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-llvm-cov-cache
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov

      - name: Install cargo-llvm-cov
        if: steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-llvm-cov

      - name: Run cargo test with coverage (${{ matrix.label }})
        id: test
        continue-on-error: true
        run: |
          slug="${{ matrix.label }}"
          slug="${slug// + /-}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          cargo xtask test \
            --features "${{ matrix.label }}" \
            --coverage \
            --save-coverage "coverage-json/${slug}.json" \
            --save-junit "test-results/${slug}.junit.xml"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results/${{ steps.test.outputs.slug }}.junit.xml
          flags: ${{ matrix.label }}
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-json-${{ steps.test.outputs.slug }}
          path: coverage-json/
          retention-days: 1

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  coverage-report:
    if: |
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-json-*
          path: coverage-json
          merge-multiple: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
          files: coverage-json/*.json
          disable_search: true
          fail_ci_if_error: false

  codecov-empty-upload:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.cargo != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Notify Codecov of non-coverage changes
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: empty-upload
          fail_ci_if_error: false

  build-kobo:
    needs: [changes, cache-warmup, build-docs-epub]
    if: github.event_name != 'pull_request' || needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest

    permissions: &build-permissions
      id-token: write
      contents: read
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - *set-build-metadata

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
        with:
          targets: arm-unknown-linux-gnueabihf

      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Download documentation EPUB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-epub
          path: docs/book/epub

      - name: Build Kobo artifacts
        uses: ./.github/actions/build-kobo
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gh-oauth-client-id: ${{ secrets.GH_OAUTH_CLIENT_ID }}

      - &get-commit
        name: Get commit hash
        id: commit
        run: echo "short_sha=$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - &determine-suffix
        name: Determine artifact suffix
        id: artifact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "suffix=pr${{ github.event.pull_request.number }}-${{ steps.commit.outputs.short_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=${{ steps.commit.outputs.short_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - &generate-attestation
        name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/cadmus
            dist/*.sh
            dist/libs/*.so*
            dist/bin/*
            release-artifacts/*.tgz

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cadmus-kobo-${{ steps.artifact.outputs.suffix }}
          path: release-artifacts/*
          retention-days: 7

  build-kobo-test:
    needs: [changes, cache-warmup, build-docs-epub]
    if: github.event_name != 'pull_request' || needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest

    permissions: *build-permissions

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - *set-build-metadata

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        id: rust-toolchain
        with:
          targets: arm-unknown-linux-gnueabihf

      - name: Restore shared cargo cache
        uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Download documentation EPUB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-epub
          path: docs/book/epub

      - name: Build Kobo test artifacts
        uses: ./.github/actions/build-kobo
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gh-oauth-client-id: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          test: "true"

      - *get-commit
      - *determine-suffix

      - *generate-attestation

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cadmus-kobo-test-${{ steps.artifact.outputs.suffix }}
          path: release-artifacts/*
          retention-days: 7

  required-cargo:
    name: required-cargo
    permissions: {}
    needs:
      - changes
      - format
      - generate-matrix
      - build-docs-epub
      - cache-warmup
      - clippy
      - clippy-report
      - test
      - build-kobo
      - build-kobo-test
    if: ${{ always() && github.event_name == 'pull_request' && (cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::One or more required jobs failed or were cancelled"
          exit 1
