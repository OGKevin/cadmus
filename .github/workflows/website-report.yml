name: Website report

on:
  workflow_run:
    workflows: ["Website"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  post-review:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          sparse-checkout: |
            .github/actions
          path: ci
          persist-credentials: false

      - uses: ./ci/.github/actions/identify-workflow-run-pr
        id: identify-pr
        with:
          head_repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          head_sha: ${{ github.event.workflow_run.head_sha }}

      - uses: ./ci/.github/actions/checkout-workflow-run-pr-head
        if: steps.identify-pr.outputs.number
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_sha }}
          base_ref: ${{ steps.identify-pr.outputs.base_ref }}
          path: pr

      - uses: ./ci/.github/actions/reviewdog-post
        if: steps.identify-pr.outputs.number
        with:
          pr_number: ${{ steps.identify-pr.outputs.number }}
          commit: ${{ github.event.workflow_run.head_sha }}
          branch: ${{ github.event.workflow_run.head_branch }}
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: prettier-website-reviewdog-input
          diagnostics_path: prettier-website-reviewdog-input/diagnostics.diff
          name: prettier
          workdir: pr
          format: diff
          reviewdog_flags: -f.diff.strip=1

      - uses: ./ci/.github/actions/reviewdog-post
        if: steps.identify-pr.outputs.number
        with:
          pr_number: ${{ steps.identify-pr.outputs.number }}
          commit: ${{ github.event.workflow_run.head_sha }}
          branch: ${{ github.event.workflow_run.head_branch }}
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: eslint-reviewdog-input
          diagnostics_path: eslint-reviewdog-input/diagnostics.rdjson
          name: eslint
          workdir: pr
          format: rdjson

      - uses: ./ci/.github/actions/reviewdog-post
        if: steps.identify-pr.outputs.number
        with:
          pr_number: ${{ steps.identify-pr.outputs.number }}
          commit: ${{ github.event.workflow_run.head_sha }}
          branch: ${{ github.event.workflow_run.head_branch }}
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: stylelint-reviewdog-input
          diagnostics_path: stylelint-reviewdog-input/diagnostics.rdjson
          name: stylelint
          workdir: pr
          format: rdjson
