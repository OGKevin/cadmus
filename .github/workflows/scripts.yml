name: Root scripts

env:
  NODE_VERSION: "24"

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "scripts-${{ github.event_name }}-${{ github.event.ref || github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scripts:
              - 'scripts/**'
              - '.prettierignore'
              - '.prettierrc.json'
              - '.github/workflows/scripts.yml'
              - '.github/workflows/scripts-report.yml'

  prettier:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/lint/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/lint

      - name: Collect prettier diagnostics
        id: collect
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mkdir -p prettier-scripts-reviewdog-input
          files=(scripts/**/*.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No scripts to format"
            : > prettier-scripts-reviewdog-input/diagnostics.diff
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --prefix .github/lint prettier --write "${files[@]}"
          if ! git diff --quiet; then
            git diff > prettier-scripts-reviewdog-input/diagnostics.diff
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "::error::Prettier found formatting issues"
            exit 1
          fi
          : > prettier-scripts-reviewdog-input/diagnostics.diff
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload reviewdog input artifact
        if: ${{ !cancelled() && steps.collect.outputs.upload == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prettier-scripts-reviewdog-input
          path: prettier-scripts-reviewdog-input/
          if-no-files-found: error
          retention-days: 1

  required-scripts:
    name: required-scripts
    permissions: {}
    needs: [changes, prettier]
    if: ${{ always() && (cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::One or more required jobs failed or were cancelled"
          exit 1
