name: Release

env:
  NODE_VERSION: "24"
  SQLX_OFFLINE: true

on:
  push:
    branches:
      - main
      - master
      - release/*
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-config:
    name: Validate release-please-config.json
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate JSON
        run: |
          if ! jq empty release-please-config.json 2>/dev/null; then
            echo "Error: release-please-config.json is not valid JSON"
            exit 1
          fi
          echo "release-please-config.json is valid JSON"

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  format-release-changelog:
    name: Format release-please CHANGELOG
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      github.event_name != 'pull_request' &&
      needs.release-please.outputs.release_created != 'true' &&
      needs.release-please.outputs.pr_number != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install rumdl
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: rumdl@0.2.78

      - name: Format CHANGELOG on release PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.release-please.outputs.pr_number }}
        run: |
          set -euo pipefail
          head_ref="$(gh pr view "${PR_NUMBER}" --json headRefName --jq '.headRefName')"
          case "${head_ref}" in
            release-please--branches--*) ;;
            *)
              echo "Skip: head ref is not a release-please branch (${head_ref})"
              exit 0
              ;;
          esac
          gh pr checkout "${PR_NUMBER}"
          rumdl fmt CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: format CHANGELOG.md with rumdl"
          git push origin "HEAD:${head_ref}"

  build-and-upload:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust-toolchain
        with:
          targets: arm-unknown-linux-gnueabihf

      - uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
          mode: restore

      - name: Build documentation EPUB
        uses: ./.github/actions/build-docs-epub
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Kobo artifacts
        uses: ./.github/actions/build-kobo
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gh-oauth-client-id: ${{ secrets.GH_OAUTH_CLIENT_ID }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/cadmus
            dist/*.sh
            dist/libs/*.so*
            dist/bin/*
            release-artifacts/*.tgz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            release-artifacts/cadmus-kobo.tar.gz \
            release-artifacts/KoboRoot.tgz \
            release-artifacts/KoboRoot-nm.tgz \
            --repo ${{ github.repository }}
