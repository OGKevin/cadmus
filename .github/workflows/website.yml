name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: "website-${{ github.event_name }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Collect prettier diagnostics
        working-directory: website
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/prettier-website-reviewdog-input"
          npx prettier --write .
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet; then
            git -C "$GITHUB_WORKSPACE" diff > "$GITHUB_WORKSPACE/prettier-website-reviewdog-input/diagnostics.diff"
            echo "::error::Prettier found formatting issues"
            exit 1
          fi

      - name: Upload reviewdog input artifact
        if: failure() && hashFiles('prettier-website-reviewdog-input/diagnostics.diff') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prettier-website-reviewdog-input
          path: prettier-website-reviewdog-input/
          retention-days: 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Prebuild
        run: npm run prebuild
        working-directory: website

      - name: Typecheck
        run: npm run typecheck
        working-directory: website

  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Collect eslint diagnostics
        working-directory: website
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/eslint-reviewdog-input"
          set +e
          # Stylish output for reviewdog -f=eslint (same idea as clippy short format).
          npx eslint -f stylish . \
            > "$GITHUB_WORKSPACE/eslint-reviewdog-input/diagnostics.txt"
          eslint_exit=$?
          set -e
          if [ "$eslint_exit" -ne 0 ]; then
            exit "$eslint_exit"
          fi

      - name: Upload reviewdog input artifact
        if: failure() && hashFiles('eslint-reviewdog-input/diagnostics.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eslint-reviewdog-input
          path: eslint-reviewdog-input/
          retention-days: 1

  stylelint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Collect stylelint diagnostics
        working-directory: website
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stylelint-reviewdog-input"
          set +e
          # Default string formatter for reviewdog -f=stylelint.
          npx stylelint "**/*.css" \
            > "$GITHUB_WORKSPACE/stylelint-reviewdog-input/diagnostics.txt"
          stylelint_exit=$?
          set -e
          # stylelint: 0 = OK, 2 = lint issues; other codes are hard failures.
          if [ "$stylelint_exit" -ne 0 ] && [ "$stylelint_exit" -ne 2 ]; then
            exit "$stylelint_exit"
          fi
          if [ "$stylelint_exit" -eq 2 ]; then
            exit 1
          fi

      - name: Upload reviewdog input artifact
        if: failure() && hashFiles('stylelint-reviewdog-input/diagnostics.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stylelint-reviewdog-input
          path: stylelint-reviewdog-input/
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website
