name: Cadmus Documentation

env:
  NODE_VERSION: "24"
  SQLX_OFFLINE: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/**
      - website/**
      - crates/**/*.rs
      - .github/actions/install-doc-tools/**
      - .github/actions/install-cadmuscli/**
      - .github/actions/clone-needed-cargo-submodules/**
      - .github/workflows/cadmus-docs.yml
      - wrangler.toml
      - package.json
      - package-lock.json
  # No paths filter: required-docs must report on every PR. The build job is
  # gated by the changes job below.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cadmus-docs-${{ github.event_name }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'website/**'
              - 'crates/**/*.rs'
              - '.github/actions/install-doc-tools/**'
              - '.github/actions/install-cadmuscli/**'
              - '.github/actions/clone-needed-cargo-submodules/**'
              - '.github/workflows/cadmus-docs.yml'
              - 'wrangler.toml'
              - 'package.json'
              - 'package-lock.json'

  build:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/clone-needed-cargo-submodules
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: rust-toolchain

      - name: Install cadmuscli
        uses: ./.github/actions/install-cadmuscli
        with:
          source: build
          rust-cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
          mode: ${{ github.event_name == 'pull_request' && 'restore' || 'save' }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set build metadata
        run: |
          {
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "PR_NUMBER=${{ github.event.number }}"
              echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
            fi
            echo "GIT_VERSION=$(git describe --tags --always)"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/cargo-cache
        with:
          cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}
          mode: restore

      - name: Install doc tools
        uses: ./.github/actions/install-doc-tools
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build documentation portal
        env:
          RUSTDOCFLAGS: -D warnings
          CADMUS_SKIP_THIRDPARTY_DEPS: "1"
        run: cadmuscli docs

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build
          path: website/out
          retention-days: 1

  deploy-cloudflare-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !github.event.repository.fork
    permissions:
      contents: read
    environment:
      name: cloudflare-workers-production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build
          path: website/out

      # CLOUDFLARE_API_TOKEN must allow Workers Scripts Edit (template:
      # "Edit Cloudflare Workers"). Account.Workers Scripts:Edit is enough
      # for assets-only `wrangler deploy`. Pages-only tokens will fail here.
      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-cloudflare-preview:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.repository.fork &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    environment:
      name: cloudflare-workers-preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build
          path: website/out

      - name: Deploy to Cloudflare Workers (Preview)
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }}

  required-docs:
    name: required-docs
    permissions: {}
    needs: [changes, build, deploy-cloudflare-preview]
    if: ${{ always() && github.event_name == 'pull_request' && (cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::One or more required jobs failed or were cancelled"
          exit 1
