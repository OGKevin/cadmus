name: Renovate config validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            config:
              - 'renovate.json'
              - '.github/workflows/renovate-config.yml'

      - name: Setup Node
        if: steps.filter.outputs.config == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: "npm"

      - name: Cache npx
        if: steps.filter.outputs.config == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm/_npx
          key: ${{ runner.os }}-npx-renovate

      - name: Validate Renovate config
        if: steps.filter.outputs.config == 'true'
        uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300 # v2.1.0
        with:
          config_file_path: renovate.json

      - name: No relevant changes
        if: steps.filter.outputs.config != 'true'
        run: echo "No Renovate config changes — skipping"
