name: Docs lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '.agents/skills/**'
              - '**/AGENTS.md'
              - '**/REVIEW.md'
              - '.rumdl.toml'
              - '.prettierignore'
              - 'thirdparty/**/*-kobo.md'
              - 'thirdparty/**/*-cadmus.md'
              - '.github/actions/rumdl-lint/**'
              - '.github/workflows/docs-lint.yml'

      - name: Collect markdown files
        if: steps.filter.outputs.docs == 'true'
        id: files
        run: |
          shopt -s globstar nullglob
          all=(docs/**/*.md .agents/skills/**/*.md **/AGENTS.md **/REVIEW.md thirdparty/**/*-kobo.md thirdparty/**/*-cadmus.md)
          files=()
          for f in "${all[@]}"; do
            [[ "$f" == node_modules/* ]] && continue
            files+=("$f")
          done
          echo "list=${files[*]}" >> "$GITHUB_OUTPUT"

      - name: rumdl
        id: rumdl
        if: steps.filter.outputs.docs == 'true'
        uses: ./.github/actions/rumdl-lint
        with:
          fail_level: error
          rumdl_flags: ${{ steps.files.outputs.list }}
          output: rumdl-reviewdog-input/diagnostics.sarif

      - name: Decide rumdl artifact upload
        id: collect
        if: ${{ !cancelled() && (steps.rumdl.outcome == 'success' || steps.rumdl.outcome == 'failure') }}
        run: |
          set -euo pipefail
          sarif=rumdl-reviewdog-input/diagnostics.sarif
          if [ "${{ steps.rumdl.outcome }}" = "success" ]; then
            if [ ! -f "$sarif" ]; then
              mkdir -p rumdl-reviewdog-input
              printf '%s\n' '{"version":"2.1.0","runs":[]}' > "$sarif"
            fi
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif [ -s "$sarif" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload reviewdog input artifact
        if: ${{ !cancelled() && steps.collect.outputs.upload == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rumdl-reviewdog-input
          path: rumdl-reviewdog-input/
          if-no-files-found: error
          retention-days: 1

      - name: No relevant changes
        if: steps.filter.outputs.docs != 'true'
        run: echo "No doc changes — skipping"
