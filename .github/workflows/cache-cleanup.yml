# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manage-caches
name: Cleanup GitHub Actions caches

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup PR caches
        run: |
          echo "Fetching list of caches for $BRANCH"
          caches=$(gh cache list --ref "$BRANCH" --limit 100 --json id,key --jq '.[] | "\(.id)\t\(.key)"')

          if [ -z "$caches" ]; then
            echo "No caches found for this PR."
            exit 0
          fi

          count=$(echo "$caches" | wc -l)
          echo "Found $count cache(s) to delete"

          deleted=0
          failed=0

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e

          while IFS=$'\t' read -r cacheId cacheKey; do
            echo "Deleting cache: $cacheKey (id=$cacheId)"
            if gh cache delete "$cacheId"; then
              deleted=$((deleted + 1))
            else
              echo "  Failed to delete cache: $cacheKey"
              failed=$((failed + 1))
            fi
          done <<< "$caches"

          echo "Cache cleanup complete: $deleted deleted, $failed failed"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge

  cleanup-master:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prune master caches
        run: |
          set -euo pipefail

          echo "Fetching list of caches for refs/heads/master"
          caches=$(gh cache list --ref refs/heads/master --limit 100 --json id,key,createdAt,lastAccessedAt,sizeInBytes)

          if [ "$(echo "$caches" | jq 'length')" -eq 0 ]; then
            echo "No caches found for master."
            exit 0
          fi

          to_delete=$(echo "$caches" | jq -c '
            def parse_gh_time:
              sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
            (map(select(.key | startswith("Linux-cargo-shared-")))
             | sort_by(.createdAt)
             | .[:-1])
            +
            (map(select(
              (.key | startswith("Linux-cargo-shared-") | not)
              and ((.lastAccessedAt | parse_gh_time) < (now - 7 * 24 * 60 * 60))
            )))
          ')

          count=$(echo "$to_delete" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No master caches selected for deletion."
            exit 0
          fi

          echo "Found $count cache(s) to delete"
          echo "$to_delete" | jq -r '.[] | "\(.id)\t\(.key)\t\(.sizeInBytes)"'

          deleted=0
          failed=0
          bytes_freed=0

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e

          while IFS=$'\t' read -r cacheId cacheKey sizeInBytes; do
            echo "Deleting cache: $cacheKey (id=$cacheId, size=$sizeInBytes)"
            if gh cache delete "$cacheId"; then
              deleted=$((deleted + 1))
              bytes_freed=$((bytes_freed + sizeInBytes))
            else
              echo "  Failed to delete cache: $cacheKey"
              failed=$((failed + 1))
            fi
          done < <(echo "$to_delete" | jq -r '.[] | "\(.id)\t\(.key)\t\(.sizeInBytes)"')

          echo "Master cache prune complete: $deleted deleted, $failed failed, ~${bytes_freed} bytes freed"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
