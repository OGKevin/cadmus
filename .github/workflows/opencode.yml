name: OpenCode

env:
  NODE_VERSION: "24"

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "opencode-${{ github.event_name }}-${{ github.event.ref || github.ref }}"
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            opencode:
              - '.opencode/**'
              - '.github/workflows/opencode.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.opencode == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .opencode/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.opencode == 'true'
        run: npm ci
        working-directory: .opencode

      - name: Typecheck
        if: steps.filter.outputs.opencode == 'true'
        run: npm run typecheck
        working-directory: .opencode

      - name: Test
        if: steps.filter.outputs.opencode == 'true'
        run: npm test
        working-directory: .opencode

  required-opencode:
    name: required-opencode
    permissions: {}
    needs: [checks]
    if: >-
      always() && (cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::One or more required jobs failed or were cancelled"
          exit 1
