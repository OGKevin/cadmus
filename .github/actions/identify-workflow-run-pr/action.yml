name: Identify workflow_run pull request
description: >
  Resolve the open PR number and base ref for a head SHA. Used by privileged
  reviewdog report workflows.

inputs:
  head_repository:
    description: >
      Head repository (owner/name), usually
      github.event.workflow_run.head_repository.full_name || github.repository.
    required: true
  head_sha:
    description: Head commit SHA (usually github.event.workflow_run.head_sha).
    required: true

outputs:
  number:
    description: Pull request number, or empty if none found.
    value: ${{ steps.identify.outputs.number }}
  base_ref:
    description: Pull request base branch name, or empty if none found.
    value: ${{ steps.identify.outputs.base_ref }}

runs:
  using: composite
  steps:
    - name: Identify PR
      id: identify
      shell: bash
      env:
        BASE_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        HEAD_REPO: ${{ inputs.head_repository }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        set -euo pipefail
        PR_JSON=$(gh api "repos/$HEAD_REPO/commits/$HEAD_SHA/pulls" \
          --jq ".[] | select(.base.repo.full_name == \"$BASE_REPO\") | {number, base_ref: .base.ref}" \
          | head -n1)
        if [ -z "$PR_JSON" ]; then
          echo "No open pull request found for $HEAD_REPO@$HEAD_SHA"
          echo "number=" >> "$GITHUB_OUTPUT"
          echo "base_ref=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "number=$(echo "$PR_JSON" | jq -r .number)" >> "$GITHUB_OUTPUT"
        echo "base_ref=$(echo "$PR_JSON" | jq -r .base_ref)" >> "$GITHUB_OUTPUT"
