name: Run rumdl with reviewdog
description: Lint Markdown with rumdl and report findings via reviewdog.

inputs:
  github_token:
    description: GITHUB_TOKEN
    default: ${{ github.token }}
    required: false
  reporter:
    description: Reporter of reviewdog command [github-check, github-pr-review].
    default: github-pr-review
    required: false
  filter_mode:
    description: |
      Filtering mode for the reviewdog command [added, diff_context, file, nofilter].
    default: nofilter
    required: false
  fail_level:
    description: |
      Exit code 1 for reviewdog if it finds at least 1 issue at this severity or above.
      Possible values: [none, any, info, warning, error]
    default: error
    required: false
  rumdl_version:
    description: Version of rumdl to install.
    default: "0.2.52"
    required: false
  rumdl_flags:
    description: Arguments passed to rumdl check (file list or paths).
    default: "."
    required: false
  output:
    description: |
      When set, write SARIF diagnostics to this path and skip reviewdog.
      Parent directories are created as needed. Used by unprivileged CI collect
      jobs so a privileged workflow_run can post comments.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
      if: inputs.output == ''

    - name: Install rumdl
      uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
      with:
        tool: rumdl@${{ inputs.rumdl_version }}

    - name: Collect rumdl SARIF
      if: inputs.output != ''
      shell: bash
      env:
        OUTPUT_PATH: ${{ inputs.output }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${OUTPUT_PATH}")"
        set +e
        rumdl check --output-format sarif ${{ inputs.rumdl_flags }} > "${OUTPUT_PATH}"
        rumdl_exit=$?
        set -e
        if [[ "${rumdl_exit}" -ne 0 && "${{ inputs.fail_level }}" != "none" ]]; then
          exit "${rumdl_exit}"
        fi

    - name: rumdl with reviewdog
      if: inputs.output == ''
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        sarif="${RUNNER_TEMP}/rumdl.sarif"
        set +e
        rumdl check --output-format sarif ${{ inputs.rumdl_flags }} > "${sarif}"
        rumdl_exit=$?
        set -e
        reviewdog \
          -f=sarif \
          -name=rumdl \
          -reporter="${{ inputs.reporter }}" \
          -filter-mode="${{ inputs.filter_mode }}" \
          -fail-level="${{ inputs.fail_level }}" \
          -level=error \
          < "${sarif}"
        if [[ "${rumdl_exit}" -ne 0 && "${{ inputs.fail_level }}" != "none" ]]; then
          exit "${rumdl_exit}"
        fi
