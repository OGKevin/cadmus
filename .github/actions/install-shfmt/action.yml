name: Install shfmt
description: Download a pinned shfmt release binary onto PATH.

inputs:
  version:
    description: shfmt release version (without leading v).
    required: false
    default: "3.11.0"

runs:
  using: composite
  steps:
    - name: Install shfmt
      shell: bash
      env:
        SHFMT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -sL \
          "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
          -o /tmp/shfmt
        sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
        shfmt -version
