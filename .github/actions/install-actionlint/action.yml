name: Install actionlint
description: Download a pinned actionlint release binary onto PATH.

inputs:
  version:
    description: actionlint release version (without leading v).
    required: false
    default: "1.7.7"

runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
          "${ACTIONLINT_VERSION}"
        echo "$PWD" >> "$GITHUB_PATH"
