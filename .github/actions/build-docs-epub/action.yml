name: Build documentation EPUB
description: >
  Install all doc tooling and build the mdBook EPUB, then upload it
  as a workflow artifact. Callers must have already checked out the
  repository, put cadmuscli on PATH, and set up a Rust toolchain
  (install-doc-tools may cargo-install mdbook tools on a cache miss).

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24"
  artifact-name:
    description: "Name of the uploaded artifact"
    required: false
    default: "docs-epub"
  retention-days:
    description: "Artifact retention in days"
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.x"

    - name: Install doc tools
      uses: ./.github/actions/install-doc-tools
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build documentation EPUB
      shell: bash
      run: cadmuscli docs --mdbook-only
      env:
        RUSTDOCFLAGS: "-D warnings"

    - name: Upload documentation EPUB
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: docs/book/epub/Cadmus Documentation.epub
        retention-days: ${{ inputs.retention-days }}
