name: Post reviewdog diagnostics from artifact
description: >
  Download a reviewdog-input artifact from a completed workflow run and post
  inline PR review comments (including an empty file to clear stale comments).
  Treats the artifact as untrusted text only. Skips when the artifact is missing
  so path-filtered collect jobs do not wipe unrelated comments.

inputs:
  pr_number:
    description: Pull request number to comment on.
    required: true
  commit:
    description: Head SHA for CI_COMMIT (usually workflow_run.head_sha).
    required: true
  branch:
    description: Head branch for CI_BRANCH (usually workflow_run.head_branch).
    required: true
  run_id:
    description: Workflow run id that uploaded the artifact.
    required: true
  artifact_name:
    description: Name of the artifact uploaded by the collect workflow.
    required: true
  diagnostics_path:
    description: >
      Path to the diagnostics file after download (relative to the workspace),
      e.g. clippy-reviewdog-input/diagnostics.txt.
    required: true
  name:
    description: Tool name passed to reviewdog -name.
    required: true
  workdir:
    description: >
      Directory containing the PR-head checkout (with .git) used for
      -filter-mode=added. Must match checkout-workflow-run-pr-head path.
    required: true
  format:
    description: >
      reviewdog -f value (e.g. clippy, eslint, stylelint, sarif, diff). Leave
      empty when using errorformat instead.
    required: false
    default: ""
  errorformat:
    description: reviewdog -efm value. Used when format is empty.
    required: false
    default: ""
  filter_mode:
    description: reviewdog -filter-mode value.
    required: false
    default: added
  reviewdog_flags:
    description: Extra reviewdog flags (space-separated).
    required: false
    default: ""
  github_token:
    description: Token with pull-requests write for the Review API.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download reviewdog input artifact
      id: download
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_name }}
        github-token: ${{ inputs.github_token }}
        run-id: ${{ inputs.run_id }}

    - name: Install reviewdog
      if: steps.download.outcome == 'success'
      uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1

    # CI_* vars are reviewdog's manual PR context (for non-pull_request jobs).
    # Unset GITHUB_ACTIONS so reviewdog uses them instead of workflow_run event
    # metadata. See: https://github.com/reviewdog/reviewdog#common-jenkins-local-etc
    - name: Post review comments
      if: steps.download.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        CI_PULL_REQUEST: ${{ inputs.pr_number }}
        CI_COMMIT: ${{ inputs.commit }}
        CI_REPO_OWNER: ${{ github.repository_owner }}
        CI_REPO_NAME: ${{ github.event.repository.name }}
        CI_BRANCH: ${{ inputs.branch }}
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github_token }}
        DIAGNOSTICS_PATH: ${{ github.workspace }}/${{ inputs.diagnostics_path }}
        RD_NAME: ${{ inputs.name }}
        RD_FORMAT: ${{ inputs.format }}
        RD_EFM: ${{ inputs.errorformat }}
        RD_FILTER_MODE: ${{ inputs.filter_mode }}
        RD_FLAGS: ${{ inputs.reviewdog_flags }}
      run: |
        set -euo pipefail
        if [ ! -f "$DIAGNOSTICS_PATH" ]; then
          mkdir -p "$(dirname "$DIAGNOSTICS_PATH")"
          : > "$DIAGNOSTICS_PATH"
        fi
        if [ ! -s "$DIAGNOSTICS_PATH" ] && [ "$RD_FORMAT" = "sarif" ]; then
          printf '%s\n' '{"version":"2.1.0","runs":[]}' > "$DIAGNOSTICS_PATH"
        fi

        args=(-name="$RD_NAME" -filter-mode="$RD_FILTER_MODE" -fail-on-error=false -reporter=github-pr-review)
        if [ -n "$RD_FORMAT" ]; then
          args+=(-f="$RD_FORMAT")
        elif [ -n "$RD_EFM" ]; then
          args+=(-efm="$RD_EFM")
        else
          echo "::error::reviewdog-post requires format or errorformat"
          exit 1
        fi

        # shellcheck disable=SC2086
        env -u GITHUB_ACTIONS reviewdog "${args[@]}" ${RD_FLAGS} < "$DIAGNOSTICS_PATH"
