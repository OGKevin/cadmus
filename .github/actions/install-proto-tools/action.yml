name: Install protobuf tooling
description: >
  Install protoc and the pinned protoc-gen-connect-openapi plugin that
  crates/api-proto/build.rs shells out to. devenv provides both locally.

inputs:
  version:
    description: "protoc-gen-connect-openapi release tag"
    required: false
    default: "v0.28.0"

runs:
  using: composite
  steps:
    - name: Install protoc
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: protobuf-compiler
        version: 1.0

    - name: Cache protoc-gen-connect-openapi
      id: proto-plugin-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/bin/protoc-gen-connect-openapi
        key: protoc-gen-connect-openapi-${{ runner.os }}-${{ inputs.version }}

    - name: Install protoc-gen-connect-openapi
      if: steps.proto-plugin-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        version="${VERSION#v}"
        asset="protoc-gen-connect-openapi_${version}_linux_amd64.tar.gz"
        base="https://github.com/sudorandom/protoc-gen-connect-openapi/releases/download/${VERSION}"
        curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
        curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors -o "$RUNNER_TEMP/$asset" "$base/$asset"
        (cd "$RUNNER_TEMP" && grep " $asset\$" checksums.txt | sha256sum -c -)
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$RUNNER_TEMP/$asset" -C "$HOME/.local/bin" protoc-gen-connect-openapi
        chmod +x "$HOME/.local/bin/protoc-gen-connect-openapi"

    - name: Add protoc-gen-connect-openapi to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
