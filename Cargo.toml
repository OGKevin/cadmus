[workspace]
resolver = "2"
members = [
  "crates/build-deps",
  "crates/core",
  "crates/cadmus",
  "crates/fetcher",
  "crates/importer",
  "crates/macros",
  "xtask",
]

[workspace.dependencies]
backon = { version = "1.6", default-features = false, features = ["std"] }
blake3 = "1"
cc = "1"
io_tee = "0.1"
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
sdl3 = { version = "0.20.0", features = ["use-pkg-config"] }
serde_json = "1.0.149"

[workspace.lints]
rustdoc.private_intra_doc_links = "allow"

[profile.release-minsized]
inherits = "release"
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true
strip = true

[patch.crates-io]
vt100 = { git = "https://github.com/KacperLa/vt100-rust.git", rev = "6a45351ac049a6c87f893aa6896451c5b3720ee7" }
