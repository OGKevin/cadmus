[workspace]
resolver = "2"
members = [
  "crates/api-proto",
  "crates/build-deps",
  "crates/core",
  "crates/cadmus",
  "crates/fetcher",
  "crates/importer",
  "crates/macros",
  "xtask",
]

[workspace.dependencies]
async-trait = "0.1"
connectrpc = { version = "0.9", default-features = false }
connectrpc-build = "0.9"
async_zip = { version = "0.0.19", default-features = false, features = ["deflate", "tokio"] }
blake3 = "1"
buffa = { version = "0.9", default-features = false, features = ["std", "json"] }
buffa-descriptor = { version = "0.9", default-features = false, features = ["std"] }
buffa-types = { version = "0.9", default-features = false, features = ["std", "json"] }
bytes = "1"
cc = "1"
gethostname = "1.1.0"
gix = { version = "0.90", default-features = false, features = [
  "revision",
  "sha1",
  "status",
] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = [
  "http1",
  "http2",
  "server-auto",
  "service",
  "tokio",
] }
mdns-sd = "0.13"
io_tee = "0.1"
octocrab = { version = "0.54.2", default-features = false, features = [
    "jwt-rust-crypto",
] }
reqwest-middleware = { version = "0.5.2", default-features = false }
reqwest-retry = { version = "0.9.1", default-features = false }
reqwest-tracing = { version = "0.7.1", default-features = false }
rars = { version = "0.12", default-features = false, features = ["encryption"] }
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
sdl3 = { version = "0.20.0", features = ["use-pkg-config"] }
serde_json = "1.0.149"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = "1.40"
tokio-util = { version = "0.7", default-features = false, features = ["compat", "rt"] }
tower = { version = "0.5", default-features = false }
uuid = { version = "1.20.0", features = ["v7"] }

[workspace.lints]
rustdoc.private_intra_doc_links = "allow"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# Renovate's checkout does not initialize git submodules, so patching by path breaks its
# Cargo.lock artifact updates. Pin by git rev in normal builds; the `html5ever` Renovate group
# keeps this rev in sync with thirdparty/html5ever.
[patch.crates-io]
markup5ever = { git = "https://github.com/OGKevin/html5ever", rev = "feb171c28b48012d5c42e24d7acfb7e2d8f79189" }
xml5ever = { git = "https://github.com/OGKevin/html5ever", rev = "feb171c28b48012d5c42e24d7acfb7e2d8f79189" }

# For html5ever development, comment out both git entries above and uncomment both path entries
# below, then run Cadmus tests against the submodule changes.
# markup5ever = { path = "thirdparty/html5ever/markup5ever" }
# xml5ever = { path = "thirdparty/html5ever/xml5ever" }

[profile.release-minsized]
inherits = "release"
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true
strip = true
